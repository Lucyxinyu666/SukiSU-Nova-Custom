name: Build Custom Manager APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PKG_NAME: com.mobile.tools.manager
      KSUD_VER: v3.0.0
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: SukiSU-Nova/SukiSU-Nova
          ref: main
          path: src

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK 37 + NDK 29 + Build Tools
        uses: android-actions/setup-android@v3
      - name: Install SDK platforms and NDK
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Download prebuilt ksud binaries (3 arch) from official release
        run: |
          set -e
          mkdir -p artifacts
          BASE="https://github.com/SukiSU-Nova/SukiSU-Nova/releases/download/${KSUD_VER}"
          curl -fL --retry 3 "$BASE/ksud-aarch64-linux-android" -o artifacts/ksud-arm64
          curl -fL --retry 3 "$BASE/ksud-armv7-linux-androideabi" -o artifacts/ksud-arm
          curl -fL --retry 3 "$BASE/ksud-x86_64-linux-android" -o artifacts/ksud-x86_64
          chmod +x artifacts/ksud-*
          ls -lh artifacts/

      - name: Download kpm tools (kpimg + kptools)
        run: |
          set -e
          kpm=src/manager/app/build/generated/kpmTools
          mkdir -p "$kpm/jniLibs/arm64-v8a" "$kpm/assets/kpm"
          PRIV="https://git.zako.shirkneko.top:20004/shirkneko/SukiSU_KernelPatch_patch/releases/download/0.14.0"
          PUB="https://github.com/bmax121/KernelPatch/releases/download/0.13.9"
          # kptools (android ELF) -> libkptools.so
          if ! curl -fL --retry 2 --max-time 120 "$PRIV/kptools-android" -o "$kpm/jniLibs/arm64-v8a/libkptools.so"; then
            curl -fL --retry 2 "$PUB/kptools-android" -o "$kpm/jniLibs/arm64-v8a/libkptools.so"
          fi
          # kpimg
          if ! curl -fL --retry 2 --max-time 120 "$PRIV/kpimg" -o "$kpm/assets/kpm/kpimg"; then
            curl -fL --retry 2 "$PUB/kpimg-android" -o "$kpm/assets/kpm/kpimg"
          fi
          ls -lh "$kpm/jniLibs/arm64-v8a/" "$kpm/assets/kpm/"

      - name: Randomize packaged identity + copy ksud
        working-directory: src/manager
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64
          rand_alpha() { openssl rand -base64 48 | tr -dc 'a-z' | cut -c1-"$1"; }
          KSUD_LIB="lib$(rand_alpha 10).so"
          CORE_LIB="$(rand_alpha 11)"
          APP_CLASS="$(rand_alpha 11)"
          PRELOAD_CLASS="$(rand_alpha 11)"
          MAIN_CLASS="$(rand_alpha 11)"
          WEBUI_CLASS="$(rand_alpha 11)"
          DOWNLOAD_CLASS="$(rand_alpha 11)"
          MAGICA_CLASS="$(rand_alpha 11)"
          find app/src/main -type f \
            \( -name '*.kt' -o -name '*.java' -o -name '*.xml' \
               -o -name '*.cc' -o -name 'CMakeLists.txt' \) \
            -exec sed -i \
              -e "s/\"libksud\.so\"/\"$KSUD_LIB\"/g" \
              -e "s/project(\"kernelsu\")/project(\"$CORE_LIB\")/" \
              -e "s/add_library(kernelsu/add_library($CORE_LIB/" \
              -e "s/target_include_directories(kernelsu /target_include_directories($CORE_LIB /" \
              -e "s/target_link_libraries(kernelsu /target_link_libraries($CORE_LIB /" \
              -e "s/loadLibrary(\"kernelsu\")/loadLibrary(\"$CORE_LIB\")/g" \
              -e "/^[[:space:]]*[*\/]/!s/KernelSUApplication/${APP_CLASS}Application/g" \
              -e "/^[[:space:]]*[*\/]/!s/AppZygotePreload/${PRELOAD_CLASS}Preload/g" \
              -e "/^[[:space:]]*[*\/]/!s/MainActivity/${MAIN_CLASS}Activity/g" \
              -e "/^[[:space:]]*[*\/]/!s/WebUIActivity/${WEBUI_CLASS}Activity/g" \
              -e "/^[[:space:]]*[*\/]/!s/DownloadService/${DOWNLOAD_CLASS}Service/g" \
              -e "/^[[:space:]]*[*\/]/!s/MagicaService/${MAGICA_CLASS}Service/g" \
              {} +
          find app/src/main -depth -type f -name 'KernelSUApplication.kt' -execdir mv {} "${APP_CLASS}Application.kt" \;
          find app/src/main -depth -type f -name 'AppZygotePreload.java' -execdir mv {} "${PRELOAD_CLASS}Preload.java" \;
          find app/src/main -depth -type f -name 'MainActivity.kt' -execdir mv {} "${MAIN_CLASS}Activity.kt" \;
          find app/src/main -depth -type f -name 'MainActivityUiState.kt' -execdir mv {} "${MAIN_CLASS}ActivityUiState.kt" \;
          find app/src/main -depth -type f -name 'MainActivityViewModel.kt' -execdir mv {} "${MAIN_CLASS}ActivityViewModel.kt" \;
          find app/src/main -depth -type f -name 'WebUIActivity.kt' -execdir mv {} "${WEBUI_CLASS}Activity.kt" \;
          find app/src/main -depth -type f -name 'DownloadService.kt' -execdir mv {} "${DOWNLOAD_CLASS}Service.kt" \;
          find app/src/main -depth -type f -name 'MagicaService.java' -execdir mv {} "${MAGICA_CLASS}Service.java" \;
          cp -f ../artifacts/ksud-arm64 "app/src/main/jniLibs/arm64-v8a/$KSUD_LIB"
          cp -f ../artifacts/ksud-arm   "app/src/main/jniLibs/armeabi-v7a/$KSUD_LIB"
          cp -f ../artifacts/ksud-x86_64 "app/src/main/jniLibs/x86_64/$KSUD_LIB"
          echo "Packaged identity: $KSUD_LIB, lib$CORE_LIB.so, ${APP_CLASS}Application"

      - name: Write custom keystore + gradle.properties
        working-directory: src/manager
        env:
          KEYSTORE_B64: ${{ secrets.CUSTOM_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.CUSTOM_STORE_PASS }}
          KEY_PASS: ${{ secrets.CUSTOM_KEY_PASS }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > custom-key.jks
          {
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_ALIAS=pr-key"
            echo "KEY_PASSWORD=$KEY_PASS"
            echo "KEYSTORE_FILE=custom-key.jks"
            echo "KSU_PACKAGE_NAME=$PKG_NAME"
            echo "KSU_NAME=System Utility"
          } >> gradle.properties
          echo "包名: $PKG_NAME (来自 gradle.properties KSU_PACKAGE_NAME)"

      - name: Build APK with Gradle
        working-directory: src/manager
        run: |
          set -e
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          bash ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g
          ls -lh app/build/outputs/apk/release/

      - name: Collect and upload APK
        run: |
          set -e
          APK=$(find src/manager/app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" "CustomManager-${PKG_NAME}-arm64-release.apk"
          echo "APK: $(ls -lh CustomManager-${PKG_NAME}-arm64-release.apk)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomManager-apk
          path: CustomManager-*.apk
          retention-days: 90
